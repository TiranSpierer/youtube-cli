[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "youtube-agent-cli"
version = "0.1.0"
description = "CLI for searching and reading YouTube"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.3",
  "yt-dlp>=2026.8.19",
  "youtube-transcript-api>=1.2.4",
]

[project.scripts]
youtube-cli = "youtube_cli.cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_cli"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
